briefDescription: "Paris, 1943. When his wife is sent behind Nazi lines, OSS agent Conor Thorn takes an off-the-books mission into Gestapo-controlled Paris to expose a double agent and bring her home safe."
fullDescription: "Paris belongs to the Gestapo. Spring, 1943. Conor Thorn is sick of losing those he treasured, so when the woman he loves is sent behind Nazi lines on a secret assignment, the frantic OSS agent jumps at British Intelligence's off-the-books offer to hunt a double agent in Paris—with no backup, no cover, and no idea who he can trust. Moving one forged paper and one held breath at a time through a city where collaborators control everything the Gestapo doesn't, Conor smuggles downed airmen and tracks the traitor while the one person he longs to keep alive remains cloaked in danger. Debts Owed is the taut fifth book in the Conor Thorn spy series—for readers who love relentless heroes, wartime treachery, and stories inspired by true events."
interstitialQuote: Daring infiltrations, military secrets, dirty politics.
