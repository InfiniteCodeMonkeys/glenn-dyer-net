testimonials:
  - quote: "Dyer's World War II thriller aches with grief as much as it plots deception and double-crossing in Nazi-occupied Paris...Threaded throughout the deception are glimmers of humanity...Real emotion runs through this narrative...Those who enjoy espionage intertwined with human emotion, moral ambiguity, and difficult questions of loyalty and obligation will be immersed."
    source: BookLife
    outlet: BookLife
  - quote: "The characters are sharp and intelligent, and the measured, deliberate, compelling dialogue matches them. Fans of thrillers set in World War II might find this novel is exactly what they have been looking for."
    source: The US Review of Books
    outlet: The US Review of Books
  - quote: "From agents and interagency squabbles to questions about loyalty and whether agents are working for the cause or the enemy, this thriller takes many unexpected turns. It dovetails the lives of participants on both sides of the Nazi occupation as Conor and Emily separately address challenges to their lives, mindsets, and loyalties."
    source: D. Donovan, Senior Reviewer, Midwest Book Review
    outlet: Midwest Book Review
