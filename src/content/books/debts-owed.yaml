testimonials:
  - quote: "A richly researched and impressively layered WWII espionage thriller, Debts Owed combines the machinery of wartime intelligence with genuinely personal stakes."
    source: Next Best Read
    outlet: ""
  - quote: "The characters are sharp and intelligent, and the measured, deliberate, compelling dialogue matches them. Fans of thrillers set in World War II might find this novel is exactly what they have been looking for."
    source: The US Review of Books
    outlet: ""
  - quote: "Dyer's World War II thriller aches with grief as much as it plots deception and double-crossing in Nazi-occupied Paris…Those who enjoy espionage intertwined with human emotion, moral ambiguity, and difficult questions of loyalty and obligation will be immersed."
    source: BookLife
    outlet: ""
  - quote: "Dyer’s straightforward prose captures the danger of occupied France and gives the story a convincing sense of wartime life…The threads come together in a tense final confrontation… Dyer adds complexity to the WWII spy thriller through shifting loyalties and competing agendas among Allied agents, German officers, and Resistance members."
    source: BookLife Prize
    outlet: ""
  - quote: "Overall, the engaging locations, storylines, and characters are sure to satisfy fans of the genre. An espionage tale with plenty of entertainment value for series’ fans."
    source: Kirkus Reviews
    outlet: ""
  - quote: "From agents and interagency squabbles to questions about loyalty and whether agents are working for the cause or the enemy, this thriller takes many unexpected turns."
    source: D. Donovan, Senior Reviewer
    outlet: Midwest Book Review
